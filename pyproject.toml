[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klvdata"
version = "0.0.3"
description = "A Python library for parsing MISB/STANAG 4609 Key Length Value (KLV) metadata."
readme = "README.rst"
license = {text = "MIT"}
authors = [{name = "paretech", email = "paretech@gmail.com"}]
keywords = ["STANAG 4609", "MISB", "KLV", "Metadata", "Video"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
]
dev = []
test = []

[project.urls]
Homepage = "https://github.com/paretech/klvdata/"

[tool.hatch.build.targets.wheel]
packages = ["src/klvdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
